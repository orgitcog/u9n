name: "🐛 Bug Report"
description: "Report a bug or issue"
title: "[BUG] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Please provide as much detail as possible to help us diagnose and fix the issue.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (system crash, data loss)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (minor inconvenience)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Neural Core (Reservoir Computing)
        - Symbolic Engine (Unreal Integration)
        - Sensorimotor (Body Schema)
        - Cognitive (Reasoning/Planning)
        - Endocrine (Emotional Regulation)
        - Gaming (Skills/Strategy)
        - Meta-Cognitive (Self-Awareness)
        - Infrastructure (Build/Test/Deploy)
        - Live2D Integration
        - MetaHuman Integration
        - Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "Describe the bug clearly"
      placeholder: "What happened?"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should have happened?"
      placeholder: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "How can we reproduce this issue?"
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Provide environment details"
      placeholder: |
        - OS: Windows 11
        - Unreal Engine: 5.4
        - GPU: RTX 4090
        - RAM: 64GB

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: "Paste any relevant logs or attach screenshots"
      placeholder: "Paste logs here or drag screenshots..."
